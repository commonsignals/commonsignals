<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" width="360" height="362" role="img" aria-label="Stance distribution"><rect width="360" height="362" fill="#F4F4EF"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#17181C">Did commenters accept the</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#17181C">central claim?</text><text x="20.0" y="89.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#5C5E64">Of the 223 comments that take a readable</text><text x="20.0" y="107.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#5C5E64">position</text><text x="20.0" y="140.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#17181C">Agree</text><rect x="20.0" y="147.9" width="256.0" height="22" fill="#2a2ad6" rx="2"/><text x="284.0" y="164.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#17181C">68%</text><text x="20.0" y="198.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#17181C">Disagree</text><rect x="20.0" y="205.9" width="67.8" height="22" fill="#2a2ad6" opacity="0.70" rx="2"/><text x="95.8" y="222.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#17181C">18%</text><text x="20.0" y="256.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#17181C">Mixed</text><rect x="20.0" y="263.9" width="52.7" height="22" fill="#2a2ad6" opacity="0.50" rx="2"/><text x="80.7" y="280.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#17181C">14%</text>