<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 531" width="360" height="531" role="img" aria-labelledby="doac-c1m-t doac-c1m-d"><title id="doac-c1m-t">Four versions of one debate: agreement from 49% to 88%</title><desc id="doac-c1m-d">YouTube, full episode: 77% agree, 20% disagree, 3% mixed (n = 15,928); Full episode, debater verdicts removed: 66% agree, 29% disagree, 5% mixed (n = 9,670); Facebook, 21-minute cut: 88% agree, 11% disagree, 2% mixed (n = 1,366); YouTube Shorts, 104-second trailer: 49% agree, 40% disagree, 11% mixed (n = 171)</desc><rect width="360" height="531" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Four versions of one debate:</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">agreement from 49% to 88%</text><text x="20.0" y="88.8" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Agree, disagree and mixed, as shares of</text><text x="20.0" y="107.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">comments taking a readable position</text><rect x="20.0" y="121.6" width="11" height="11" fill="#0f8a78" rx="2"/><text x="36.0" y="132.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">Agree</text><rect x="88.4" y="121.6" width="11" height="11" fill="#8c8579" rx="2"/><text x="104.4" y="132.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">Disagree</text><rect x="178.6" y="121.6" width="11" height="11" fill="#c9c2b6" rx="2"/><text x="194.6" y="132.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">Mixed</text><text x="20.0" y="158.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">YouTube, full episode</text><text x="20.0" y="176.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#635f54">n = 15,928</text><rect x="20.0" y="184.6" width="246.7" height="20" fill="#0f8a78"/><rect x="266.7" y="184.6" width="63.0" height="20" fill="#8c8579"/><rect x="329.8" y="184.6" width="9.9" height="20" fill="#c9c2b6"/><text x="20.0" y="223.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#232019">77% agree  ·  20% disagree  ·  3% mixed</text><text x="20.0" y="253.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">Full episode, debater verdicts removed</text><text x="20.0" y="271.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#635f54">n = 9,670</text><rect x="20.0" y="279.1" width="210.2" height="20" fill="#0f8a78"/><rect x="230.2" y="279.1" width="93.8" height="20" fill="#8c8579"/><rect x="324.0" y="279.1" width="16.0" height="20" fill="#c9c2b6"/><text x="20.0" y="317.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#232019">66% agree  ·  29% disagree  ·  5% mixed</text><text x="20.0" y="347.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">Facebook, 21-minute cut</text><text x="20.0" y="365.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#635f54">n = 1,366</text><rect x="20.0" y="373.6" width="280.0" height="20" fill="#0f8a78"/><rect x="300.0" y="373.6" width="33.9" height="20" fill="#8c8579"/><rect x="333.9" y="373.6" width="6.1" height="20" fill="#c9c2b6"/><text x="20.0" y="412.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#232019">88% agree  ·  11% disagree  ·  2% mixed</text><text x="20.0" y="442.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">YouTube Shorts, 104-second trailer</text><text x="20.0" y="460.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#635f54">n = 171</text><rect x="20.0" y="468.1" width="155.2" height="20" fill="#0f8a78"/><rect x="175.2" y="468.1" width="129.3" height="20" fill="#8c8579"/><rect x="304.5" y="468.1" width="35.5" height="20" fill="#c9c2b6"/><text x="20.0" y="506.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" fill="#232019">49% agree  ·  40% disagree  ·  11% mixed</text></svg>
