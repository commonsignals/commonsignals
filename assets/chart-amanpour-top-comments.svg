78" height="16" fill="#7a1e49" opacity="1.0"/><text class="n" x="32" y="402">35</text><text class="q" x="32" y="423">“One would think that after an incident like this Congr…”</text><rect x="400" y="412" width="76" height="16" fill="#7a1e49" opacity="1.0"/><text class="n" x="32" y="438">34</text><text class="q" x="32" y="459">“Thanks PBS for not falling for the 'agents went rogue'…”</text><rect x="400" y="448" width="56" height="16" fill="#7a1e49" opacity="1.0"/><text class="n" x="32" y="474">25</text><text class="q" x="32" y="495">“I'm glad I watched this commentary. Heidi Khlaaf is br…”</text><rect x="400" y="484" width="47" height="16" fill="#7a1e49" opacity="1.0"/><text class="n" x="32" y="510">21</text><rect x="32" y="520" width="10" height="10" fill="#7a1e49"/><text class="t" x="48" y="529">agrees</text><rect x="130" y="520" width="10" height="10" fill="#7a1e49" opacity="0.35"/><text class="t" x="146" y="529">disagrees or mixed</text></svg>