<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1113" width="360" height="1113" role="img" aria-label="Most-engaged comments ranked"><desc id="chart-data">{"title": "Engagement concentrates in a handful of comments", "subs": ["Most-engaged comments. Bar length is engagement; 28,913 = full width."], "aria": "Most-engaged comments ranked", "type": "top", "rows": [{"quote": "\"Well this was a pleasant read right before bed.\"", "value": "28,913", "frac": 1.0, "key": "none"}, {"quote": "\"“I wonder why progress looks so much like destruction” —John Steinbeck\"", "value": "19,235", "frac": 0.6633333333333333, "key": "agree"}, {"quote": "\"Nobody in the replies even remotely understands what he’s saying here.\"", "value": "11,081", "frac": 0.38, "key": "agree"}, {"quote": "\"With all respect, this is bizarre. It’s a ridiculous take. Humans have evolved over hundreds of thousands of years.\"", "value": "8,285", "frac": 0.2833333333333333, "key": "disagree"}, {"quote": "\"okay so buy the IPO?\"", "value": "7,802", "frac": 0.26666666666666666, "key": "disagree"}, {"quote": "\"if you really believe this you stay on the job and sabotage the progress, what does resigning do? you think it's going to kill everybody and you decided not to to fight?\"", "value": "6,612", "frac": 0.22666666666666666, "key": "disagree"}, {"quote": "\"So…\"", "value": "6,582", "frac": 0.22666666666666666, "key": "none"}, {"quote": "\"Found the solution\"", "value": "6,480", "frac": 0.22333333333333333, "key": "none"}, {"quote": "\"This guy also worked at Anthropic and quit. Excellent video warning about AI. Fantastic watch. 🤖\"", "value": "6,022", "frac": 0.20666666666666667, "key": "agree"}, {"quote": "\"Good for you, this video lives in my head\"", "value": "5,683", "frac": 0.19333333333333333, "key": "agree"}, {"quote": "\"Could someone explain to me how AI could “kill us all” without using a nuke or some type of biological means as an example?\"", "value": "3,811", "frac": 0.13, "key": "none"}, {"quote": "\"Reminds me of this video\"", "value": "3,762", "frac": 0.13, "key": "none"}], "legend": {"agree": "Agrees"}, "feet": []}</desc><rect width="360" height="1113" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Engagement concentrates in a</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">handful of comments</text><text x="20.0" y="88.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Most-engaged comments. Bar length is</text><text x="20.0" y="106.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">engagement; 28,913 = full width.</text><text x="20.0" y="137.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Well this was a pleasant read right</text><text x="20.0" y="156.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">before bed."</text><rect x="20.0" y="163.9" width="250.0" height="14" fill="#c9c2b6" rx="2"/><text x="278.0" y="175.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">28,913</text><text x="20.0" y="208.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"“I wonder why progress looks so much</text><text x="20.0" y="227.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">like destruction” —John Steinbeck"</text><rect x="20.0" y="234.9" width="165.8" height="14" fill="#0f8a78" rx="2"/><text x="193.8" y="246.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600