xt x="20.0" y="511.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"if you really believe this you stay on</text><text x="20.0" y="530.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">the job and sabotage the progress, what</text><text x="20.0" y="549.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">does resigning do? you think it's going</text><text x="20.0" y="568.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">to kill everybody and you decided not</text><text x="20.0" y="587.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">to to fight?"</text><rect x="20.0" y="594.9" width="56.7" height="14" fill="#a8323e" rx="2"/><text x="84.7" y="606.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">6,612</text><text x="20.0" y="639.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"So…"</text><rect x="20.0" y="646.9" width="56.7" height="14" fill="#c9c2b6" rx="2"/><text x="84.7" y="658.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">6,582</text><text x="20.0" y="691.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Found the solution"</text><rect x="20.0" y="698.9" width="55.8" height="14" fill="#c9c2b6" rx="2"/><text x="83.8" y="710.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">6,480</text><text x="20.0" y="743.9" font-family='"IBM Plex Sans"