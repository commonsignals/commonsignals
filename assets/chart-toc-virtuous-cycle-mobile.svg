<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 566" width="360" height="566" role="img" aria-label="A virtuous circle: a strong social mandate drives durable governance, compels companies, and produces active public behaviour, which reinforces the mandate"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a1e49"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a1e49"/></marker></defs><rect width="360" height="566" fill="#f5f4ef"/><text x="20.0" y="39.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">A strong social mandate</text><text x="20.0" y="63.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">creates a virtuous circle</text><rect x="20" y="82" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#7a1e49" stroke-width="1.3"/><text x="162.0" y="114.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Strong social mandate</text><text x="162.0" y="139.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">A majority see AI governance as a</text><text x="162.0" y="158.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">priority</text><path d="M162.0 174 L162.0 194" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="198" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#7a1e49" stroke-width="1.3"/><text x="162.0" y="230.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Durable governance</text><text x="162.0" y="255.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Rules the public supports and</text><text x="162.0" y="274.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">drives</text><path d="M162.0 290 L162.0 310" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="314" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#7a1e49" stroke-width="1.3"/><text x="162.0" y="346.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Companies compelled</text><text x="162.0" y="371.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Social licence makes safety a</text><text x="162.0" y="390.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">condition</text><path d="M162.0 406 L162.0 426" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="430" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#7a1e49" stroke-width="1.3"/><text x="162.0" y="462.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Active public behaviour</text><text x="162.0" y="487.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">People question, choose, get</text><text x="162.0" y="506.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">involved</text><path d="M306 490 L322 490 Q332 490 332 480 L332 122 Q332 112 322 112 L308 112" fill="none" stroke="#7a1e49" stroke-width="1.5" marker-end="url(#b)"/><text x="180.0" y="542.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Each stage reinforces the next</text></svg>
