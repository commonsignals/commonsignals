<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="The most-liked comments, ranked by likes, from 17,953 down to 167" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 11.5px; fill: #635f54; }
    .n { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #232019; }
    .q { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 13px; fill: #232019; }
    .h { font-family: "Lora", Georgia, serif; font-size: 17px; font-weight: 600; fill: #232019; }
    .axis { stroke: #d8d6d1; stroke-width: 1; }
    .acc { fill: #7a1e49; }
    .rej { fill: #7a1e49; opacity: 0.35; }
    .prac { fill: #232019; }
  </style>
  <rect width="720" height="520" fill="#f5f4ef"/>
  <text class="h" x="32" y="40">Likes concentrate in a handful of comments</text>
  <text class="t" x="32" y="60">Most-liked comments in the thread. Bar length is likes; 17,953 = full width.</text>

  <!-- scale: 17,953 -> 300px ; origin x=400 ; row pitch 36 -->
  <g transform="translate(400,84)">
    <line class="axis" x1="0" y1="-8" x2="0" y2="400"/>

    <text class="q" x="-368" y="15">"Why isn't this common sense, we have movies..."</text>
    <rect class="acc" x="0" y="4" width="300" height="16"/>
    <text class="n" x="-368" y="30">17,953</text>

    <text class="q" x="-368" y="51">"Why do I feel like it's too late?"</text>
    <rect class="acc" x="0" y="40" width="135" height="16"/>
    <text class="n" x="-368" y="66">8,080</text>

    <text class="q" x="-368" y="87">"That's what AI companies want you to think" (reply)</text>
    <rect class="acc" x="0" y="76" width="128" height="16"/>
    <text class="n" x="-368" y="102">7,639</text>

    <text class="q" x="-368" y="123">"...both hilarious and incredibly scary"</text>
    <rect class="acc" x="0" y="112" width="85" height="16"/>
    <text class="n" x="-368" y="138">5,058</text>

    <text class="q" x="-368" y="159">"Friends don't care... We're toast."</text>
    <rect class="acc" x="0" y="148" width="34" height="16"/>
    <text class="n" x="-368" y="174">2,008</text>

    <text class="q" x="-368" y="195">"soon we'll have no mouths but must scream"</text>
    <rect class="acc" x="0" y="184" width="15" height="16"/>
    <text class="n" x="-368" y="210">921</text>

    <text class="q" x="-368" y="231">Soares supplying his credentials (reply)</text>
    <rect class="acc" x="0" y="220" width="9" height="16"/>
    <text class="n" x="-368" y="246">512</text>

    <text class="q" x="-368" y="267">"Why did billionaires open Pandora's box..."</text>
    <rect class="acc" x="0" y="256" width="8" height="16"/>
    <text class="n" x="-368" y="282">487</text>

    <text class="q" x="-368" y="303">"just fucking explain it normally"</text>
    <rect class="rej" x="0" y="292" width="5" height="16"/>
    <text class="n" x="-368" y="318">279</text>

    <text class="q" x="-368" y="339">Data-centre campaigns: most-liked practical reply</text>
    <rect class="prac" x="0" y="328" width="3" height="16"/>
    <text class="n" x="-368" y="354">167</text>

    <text class="q" x="-368" y="375">"...can't change the sky without changing your face?"</text>
    <rect class="rej" x="0" y="364" width="2" height="16"/>
    <text class="n" x="-368" y="390">120</text>
  </g>

  <g transform="translate(32,490)">
    <rect x="0" y="-9" width="10" height="10" fill="#7a1e49"/><text class="t" x="16" y="0">accepts the danger</text>
    <rect x="150" y="-9" width="10" height="10" fill="#7a1e49" opacity="0.35"/><text class="t" x="166" y="0">rejects or objects</text>
    <rect x="300" y="-9" width="10" height="10" fill="#232019"/><text class="t" x="316" y="0">names an action</text>
  </g>
</svg>
