<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" role="img" aria-label="Stance distribution"><style>
.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:12px;fill:#5C5E64}
.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;fill:#17181C}
.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14px;fill:#17181C}
.q{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:13px;fill:#17181C}
.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;font-weight:600;fill:#17181C}
.ax{stroke:#DBDBD3;stroke-width:1}
</style><rect width="720" height="254" fill="#F4F4EF"/><text class="h" x="32" y="40">Did commenters accept the central claim?</text><text class="t" x="32" y="60">Of the 1,840 comments that take a readable position</text><line class="ax" x1="200" y1="80" x2="200" y2="210"/><text class="l" x="188" y="106" text-anchor="end">Agree</text><rect x="200" y="90" width="195" height="24" fill="#2A2AD6" opacity="1.0"/><text class="n" x="403" y="107">43%</text><text class="l" x="188" y="146" text-anchor="end">Disagree</text><rect x="200" y="130" width="183" height="24" fill="#2A2AD6" opacity="0.7"/><text class="n" x="391" y="147">40%</text><text class="l" x="188" y="186" text-anchor="end">Mixed</text><rect x="200" y="170" width="80" height="24" fill="#2A2AD6" opacity="0.5"/><text class="n" x="288" y="187">18%</text><text class="t" x="32" y="234">Weighted by engagement, 51% of engagement sits with comments that agree.</text></svg>