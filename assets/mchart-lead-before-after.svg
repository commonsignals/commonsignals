<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-label="Before and after independent verification" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:12px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14px;fill:#17181C}.s{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:13px;font-weight:600;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}.ax{stroke:#DBDBD3;stroke-width:1}</style><rect width="860" height="370" fill="#F4F4EF"/><text class="h" x="32" y="36">What changed when someone else checked the work</text><text class="t" x="32" y="56">r/artificial reacting to OpenAI's own account, 31 July (n=80 coded), against eight subreddits reacting to</text><text class="t" x="32" y="72">METR and Redwood's independent report, after 26 August (n=612 coded).</text><text class="s" x="286" y="118" text-anchor="end">Reject it as fabricated or hyped</text><text class="t" x="286" y="134" text-anchor="end">% of comments taking a position</text><rect x="300" y="104" width="105" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="413" y="116">23.9%</text><text class="t" x="457" y="116">before</text><rect x="300" y="123" width="42" height="15" fill="#2A2AD6"/><text class="n" x="350" y="135">9.6%</text><text class="t" x="394" y="135">after</text><text class="s" x="286" y="176" text-anchor="end">Accept it as real and consequential</text><text class="t" x="286" y="192" text-anchor="end">% of comments taking a position</text><rect x="300" y="162" width="131" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="439" y="174">29.9%</text><text class="t" x="483" y="174">before</text><rect x="300" y="181" width="201" height="15" fill="#2A2AD6"/><text class="n" x="509" y="193">45.9%</text><text class="t" x="553" y="193">after</text><text class="s" x="286" y="234" text-anchor="end">Call it a marketing stunt</text><text class="t" x="286" y="250" text-anchor="end">% of all coded comments</text><rect x="300" y="220" width="110" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="418" y="232">25.0%</text><text class="t" x="462" y="232">before</text><rect x="300" y="239" width="22" height="15" fill="#2A2AD6"/><text class="n" x="330" y="251">5.1%</text><text class="t" x="374" y="251">after</text><text class="s" x="286" y="292" text-anchor="end">Accept it, argue about the setup</text><text class="t" x="286" y="308" text-anchor="end">% of all coded comments</text><rect x="300" y="278" width="104" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="412" y="290">23.8%</text><text class="t" x="456" y="290">before</text><rect x="300" y="297" width="60" height="15" fill="#2A2AD6"/><text class="n" x="368" y="309">13.7%</text><text class="t" x="412" y="309">after</text><line class="ax" x1="300" y1="96" x2="300" y2="320"/><text class="t" x="32" y="346">Different threads, same subreddit ecosystem and the same incident. The only thing that changed between them was an independent report.</text></svg>