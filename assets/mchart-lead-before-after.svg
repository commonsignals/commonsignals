<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" width="860" height="384" role="img" aria-label="Before and after independent verification"><style>.t{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:12px;fill:#5C5E64}.n{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:13px;font-weight:700;fill:#17181C}.l{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:14px;fill:#17181C}.s{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:13px;font-weight:600;fill:#17181C}.h{font-family:"Lora",Georgia,serif;font-size:17px;font-weight:600;fill:#17181C}.ax{stroke:#DBDBD3;stroke-width:1}</style><rect width="860" height="384" fill="#F4F4EF"/><text class="h" x="32" y="36">What changed when someone else checked the work</text><text class="t" x="32" y="56">r/artificial reacting to OpenAI's own account, 31 July (n=52 coded), against eight subreddits reacting to</text><text class="t" x="32" y="72">METR and Redwood's independent report, after 26 August (n=464 coded).</text><text class="s" x="286" y="118" text-anchor="end">Reject it as fabricated or hyped</text><text class="t" x="286" y="134" text-anchor="end">% of comments taking a position</text><rect x="300" y="104" width="97" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="410" y="116">22%</text><text class="t" x="454" y="116">Before</text><rect x="300" y="123" width="61" height="15" fill="#2A2AD6"/><text class="n" x="371" y="135">14%</text><text class="t" x="415" y="135">After</text><text class="s" x="286" y="176" text-anchor="end">Accept it as real and consequential</text><text class="t" x="286" y="192" text-anchor="end">% of comments taking a position</text><rect x="300" y="162" width="225" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="538" y="174">51%</text><text class="t" x="582" y="174">Before</text><rect x="300" y="181" width="302" height="15" fill="#2A2AD6"/><text class="n" x="612" y="193">69%</text><text class="t" x="656" y="193">After</text><text class="s" x="286" y="234" text-anchor="end">Call it a marketing stunt</text><text class="t" x="286" y="250" text-anchor="end">% of all coded comments</text><rect x="300" y="220" width="51" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="364" y="232">12%</text><text class="t" x="408" y="232">Before</text><rect x="300" y="239" width="38" height="15" fill="#2A2AD6"/><text class="n" x="348" y="251">9%</text><text class="t" x="392" y="251">After</text><text class="s" x="286" y="292" text-anchor="end">Accept it, argue about the setup</text><text class="t" x="286" y="308" text-anchor="end">% of all coded comments</text><rect x="300" y="278" width="102" height="15" fill="#2A2AD6" opacity="0.32"/><text class="n" x="415" y="290">23%</text><text class="t" x="459" y="290">Before</text><rect x="300" y="297" width="25" height="15" fill="#2A2AD6"/><text class="n" x="335" y="309">6%</text><text class="t" x="379" y="309">After</text><line class="ax" x1="300" y1="96" x2="300" y2="320"/><text class="t" x="32" y="346">Different threads, same subreddit ecosystem and the same incident.</text><text class="t" x="32" y="362">The only thing that changed between them was an independent report.</text></svg>
