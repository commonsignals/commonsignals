<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 541" width="720" height="541" role="img" aria-label="Before and after independent verification: rejecting it as fabricated fell from 22% to 14%, accepting it as real rose from 51% to 69%, calling it a marketing stunt fell from 12% to 9%, and accepting it while arguing about the setup fell from 23% to 6%"><desc id="chart-data">{"type": "paired", "title": "What changed when someone else checked the work", "subs": ["r/artificial reacting to OpenAI's own account, 31 July (n=52 coded), against eight subreddits reacting to METR and Redwood's independent report, after 26 August (n=464 coded)."], "series": ["Before", "After"], "rows": [{"label": "Reject it as fabricated or hyped", "note": "% of comments taking a position", "a": ["22%", 22], "b": ["14%", 14]}, {"label": "Accept it as real and consequential", "note": "% of comments taking a position", "a": ["51%", 51], "b": ["69%", 69]}, {"label": "Call it a marketing stunt", "note": "% of all coded comments", "a": ["12%", 12], "b": ["9%", 9]}, {"label": "Accept it, argue about the setup", "note": "% of all coded comments", "a": ["23%", 23], "b": ["6%", 6]}], "feet": ["Different threads, same subreddit ecosystem and the same incident. The only thing that changed between them was an independent report."], "aria": "Before and after independent verification: rejecting it as fabricated fell from 22% to 14%, accepting it as real rose from 51% to 69%, calling it a marketing stunt fell from 12% to 9%, and accepting it while arguing about the setup fell from 23% to 6%"}</desc><rect width="720" height="541" fill="#f5f4ef"/><text x="32.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="17" font-weight="600" fill="#232019">What changed when someone else checked the work</text><text x="32.0" y="63.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">r/artificial reacting to OpenAI's own account, 31 July (n=52 coded), against eight subreddits</text><text x="32.0" y="80.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">reacting to METR and Redwood's independent report, after 26 August (n=464 coded).</text><rect x="32.0" y="98.1" width="11.0" height="11" fill="#c9c2b6" rx="2"/><text x="48.0" y="108.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">Before</text><rect x="107.5" y="98.1" width="11.0" height="11" fill="#5b554c" rx="2"/><text x="123.5" y="108.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">After</text><text x="32.0" y="136.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" font-weight="600" fill="#232019">Reject it as fabricated or hyped</text><text x="32.0" y="152.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">% of comments taking a position</text><rect x="32.0" y="160.1" width="170.9" height="15" fill="#c9c2b6" rx="2"/><text x="210.9" y="172.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="#232019">22%</text><text x="240.3" y="172.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">before</text><rect x="32.0" y="180.1" width="108.8" height="15" fill="#5b554c" rx="2"/><text x="148.8" y="192.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="#232019">14%</text><text x="178.2" y="192.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">after</text><text x="32.0" y="226.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" font-weight="600" fill="#232019">Accept it as real and consequential</text><text x="32.0" y="241.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">% of comments taking a position</text><rect x="32.0" y="249.6" width="396.2" height="15" fill="#c9c2b6" rx="2"/><text x="436.2" y="262.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="#232019">51%</text><text x="465.6" y="262.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">before</text><rect x="32.0" y="269.6" width="536.0" height="15" fill="#5b554c" rx="2"/><text x="576.0" y="282.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="#232019">69%</text><text x="605.4" y="282.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">after</text><text x="32.0" y="315.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" font-weight="600" fill="#232019">Call it a marketing stunt</text><text x="32.0" y="331.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">% of all coded comments</text><rect x="32.0" y="339.1" width="93.2" height="15" fill="#c9c2b6" rx="2"/><text x="133.2" y="351.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="#232019">12%</text><text x="162.6" y="351.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">before</text><rect x="32.0" y="359.1" width="69.9" height="15" fill="#5b554c" rx="2"/><text x="109.9" y="371.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe U