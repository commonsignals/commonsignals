<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 390" width="340" height="390" role="img" aria-label="Composition of the mixed bloc"><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}</style><rect width="340" height="390" fill="#F4F4EF"/><text class="h" x="20" y="28">What the mixed majority believes</text><text class="t" x="20" y="48">The 186 comments coded mixed after</text><text class="t" x="20" y="62">the report, by the frame they lead</text><text class="t" x="20" y="76">with. None of them dispute that the</text><text class="t" x="20" y="90">incident happened.</text><text class="l" x="20" y="126">They blame the humans, not the agents</text><rect x="20" y="134" width="260" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="290" y="148">42</text><text class="l" x="20" y="180">They argue the eval was badly designed</text><rect x="20" y="188" width="173" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="203" y="202">28</text><text class="l" x="20" y="234">They sympathise with the agents</text><rect x="20" y="242" width="105" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="135" y="256">17</text><text class="l" x="20" y="288">They find the coordination impressive</text><rect x="20" y="296" width="93" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="123" y="310">15</text><text class="l" x="20" y="342">They object to the agent framing</text><rect x="20" y="350" width="62" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="92" y="364">10</text></svg>
