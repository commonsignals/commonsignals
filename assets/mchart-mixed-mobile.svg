<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 390" width="340" height="390" role="img" aria-label="Composition of the mixed bloc"><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}</style><rect width="340" height="390" fill="#F4F4EF"/><text class="h" x="20" y="28">What the mixed majority believes</text><text class="t" x="20" y="48">The 73 comments coded mixed after</text><text class="t" x="20" y="62">the report, by the frame they lead</text><text class="t" x="20" y="76">with. None of them dispute that the</text><text class="t" x="20" y="90">incident happened.</text><text class="l" x="20" y="126">What they were told, badly supervised</text><rect x="20" y="134" width="260" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="290" y="148">30</text><text class="l" x="20" y="180">Blame the humans who designed the test</text><rect x="20" y="188" width="199" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="229" y="202">23</text><text class="l" x="20" y="234">Still call it staged or exaggerated</text><rect x="20" y="242" width="69" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="99" y="256">8</text><text class="l" x="20" y="288">Question the investigators' independence</text><rect x="20" y="296" width="35" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="65" y="310">4</text><text class="l" x="20" y="342">Other</text><rect x="20" y="350" width="69" height="18" fill="#2A2AD6" opacity="0.75"/><text class="n" x="99" y="364">8</text></svg>
