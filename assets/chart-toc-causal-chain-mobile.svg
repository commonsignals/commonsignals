<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 922" width="360" height="922" role="img" aria-label="The causal chain from activities to impact: activities lead to outputs, which lead to communicator outcomes, which lead to public outcomes, which lead to a durable social mandate for AI governance, each step carrying an assumption"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a1e49"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635f54"/></marker></defs><rect width="360" height="922" fill="#f5f4ef"/><text x="20.0" y="39.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">The causal chain</text><text x="20.0" y="71.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-weight="600" letter-spacing="0.5" fill="#7a1e49">WHAT WE CONTROL AND INFLUENCE</text><rect x="20" y="82" width="320" height="110" rx="8" fill="#7a1e49" fill-opacity="0.1" stroke="#7a1e49" stroke-width="1.4"/><text x="180.0" y="114.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">1. Activities: generate the</text><text x="180.0" y="134.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">evidence</text><text x="180.0" y="159.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Segmentation, message testing, comment</text><text x="180.0" y="178.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">analysis, messenger map, training</text><path d="M36 195 L36 237" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><text x="54.0" y="213.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">measured effects predict real-campaign</text><text x="54.0" y="231.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">effects</text><rect x="20" y="240" width="320" height="109" rx="8" fill="#7a1e49" fill-opacity="0.1" stroke="#7a1e49" stroke-width="1.4"/><text x="180.0" y="272.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">2. Outputs: publish as open data</text><text x="180.0" y="297.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Published segments, tested frames,</text><text x="180.0" y="316.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">guides, trained messengers, impact</text><text x="180.0" y="335.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">report</text><path d="M36 352 L36 382" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><text x="54.0" y="373.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">evidence seen as credible by both sides</text><rect x="20" y="385" width="320" height="109" rx="8" fill="#7a1e49" fill-opacity="0.1" stroke="#7a1e49" stroke-width="1.4"/><text x="180.0" y="417.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">3. Communicator outcomes</text><text x="180.0" y="442.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">(our proximate outcome)</text><text x="180.0" y="461.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Communicators change what they say and</text><text x="180.0" y="480.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">who says it</text><path d="M36 501 L36 579" fill="none" stroke="#7a1e49" stroke-width="1.7" marker-end="url(#a)"/><text x="54.0" y="519.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">communicators act on evidence, not</text><text x="54.0" y="537.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">instinct</text><text x="54.0" y="555.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">(the assumption the whole model rests</text><text x="54.0" y="573.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">on)</text><text x="20.0" y="605.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-weight="600" letter-spacing="0.5" fill="#7a1e49">WHAT WE CONTRIBUTE TO</text><rect x="20" y="616" width="320" height="128" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="180.0" y="648.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">4. Public outcomes</text><text x="180.0" y="673.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Concern becomes commitment</text><text x="180.0" y="692.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Cross-societal concern</text><text x="180.0" y="711.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Polarisation avoided</text><text x="180.0" y="730.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Concern turned into action</text><path d="M36 747 L36 789" fill="none" stroke="#635f54" stroke-width="1.7" marker-end="url(#b)"/><text x="54.0" y="765.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">better communication moves attitudes at</text><text x="54.0" y="783.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-style="italic" fill="#635f54">scale</text><rect x="20" y="792" width="320" height="110" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="180.0" y="824.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">5. Impact: a durable social</text><text x="180.0" y="844.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">mandate for AI governance</text><text x="180.0" y="869.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Hard-to-reverse rules, and a social</text><text x="180.0" y="888.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">licence conditional on safety</text></svg>
