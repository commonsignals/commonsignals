<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 620" width="340" height="620" role="img" aria-label="Before and after independent verification"><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;fill:#17181C}.s{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;font-weight:600;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}</style><rect width="340" height="620" fill="#F4F4EF"/><text class="h" x="20" y="24">What changed when someone</text><text class="h" x="20" y="44">checked the work</text><text class="t" x="20" y="68">r/artificial reacting to OpenAI's own</text><text class="t" x="20" y="82">account, 31 July (n=80 coded), against</text><text class="t" x="20" y="96">eight subreddits reacting to METR and</text><text class="t" x="20" y="110">Redwood's independent report, after 26</text><text class="t" x="20" y="124">August (n=612 coded).</text><text class="s" x="20" y="158">Reject it as fabricated or hyped</text><text class="t" x="20" y="172">% of comments taking a position</text><rect x="20" y="180" width="83" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="113" y="192">23.9%</text><text class="t" x="163" y="192">before</text><rect x="20" y="202" width="33" height="16" fill="#2A2AD6"/><text class="n" x="63" y="214">9.6%</text><text class="t" x="105" y="214">after</text><text class="s" x="20" y="258">Accept it as real and consequential</text><text class="t" x="20" y="272">% of comments taking a position</text><rect x="20" y="280" width="104" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="134" y="292">29.9%</text><text class="t" x="184" y="292">before</text><rect x="20" y="302" width="160" height="16" fill="#2A2AD6"/><text class="n" x="190" y="314">45.9%</text><text class="t" x="240" y="314">after</text><text class="s" x="20" y="358">Call it a marketing stunt</text><text class="t" x="20" y="372">% of all coded comments</text><rect x="20" y="380" width="87" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="117" y="392">25.0%</text><text class="t" x="167" y="392">before</text><rect x="20" y="402" width="18" height="16" fill="#2A2AD6"/><text class="n" x="48" y="414">5.1%</text><text class="t" x="90" y="414">after</text><text class="s" x="20" y="458">Accept it, argue about the setup</text><text class="t" x="20" y="472">% of all coded comments</text><rect x="20" y="480" width="83" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="113" y="492">23.8%</text><text class="t" x="163" y="492">before</text><rect x="20" y="502" width="48" height="16" fill="#2A2AD6"/><text class="n" x="78" y="514">13.7%</text><text class="t" x="128" y="514">after</text><text class="t" x="20" y="544">Different threads, same subreddit</text><text class="t" x="20" y="558">ecosystem and the same incident. The only</text><text class="t" x="20" y="572">thing that changed between them was an</text><text class="t" x="20" y="586">independent report.</text></svg>
