<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 620" width="340" height="620" role="img" aria-label="Before and after independent verification"><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;fill:#17181C}.s{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;font-weight:600;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}</style><rect width="340" height="620" fill="#F4F4EF"/><text class="h" x="20" y="24">What changed when someone</text><text class="h" x="20" y="44">checked the work</text><text class="t" x="20" y="68">r/artificial reacting to OpenAI's own</text><text class="t" x="20" y="82">account, 31 July (n=52 coded), against</text><text class="t" x="20" y="96">eight subreddits reacting to METR and</text><text class="t" x="20" y="110">Redwood's independent report, after 26</text><text class="t" x="20" y="124">August (n=464 coded).</text><text class="s" x="20" y="158">Reject it as fabricated or hyped</text><text class="t" x="20" y="172">% of comments taking a position</text><rect x="20" y="180" width="77" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="107" y="192">22%</text><text class="t" x="153" y="192">before</text><rect x="20" y="202" width="48" height="16" fill="#2A2AD6"/><text class="n" x="78" y="214">14%</text><text class="t" x="118" y="214">after</text><text class="s" x="20" y="258">Accept it as real and consequential</text><text class="t" x="20" y="272">% of comments taking a position</text><rect x="20" y="280" width="178" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="208" y="292">51%</text><text class="t" x="254" y="292">before</text><rect x="20" y="302" width="239" height="16" fill="#2A2AD6"/><text class="n" x="269" y="314">69%</text><text class="t" x="309" y="314">after</text><text class="s" x="20" y="358">Call it a marketing stunt</text><text class="t" x="20" y="372">% of all coded comments</text><rect x="20" y="380" width="40" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="70" y="392">12%</text><text class="t" x="116" y="392">before</text><rect x="20" y="402" width="30" height="16" fill="#2A2AD6"/><text class="n" x="60" y="414">9%</text><text class="t" x="100" y="414">after</text><text class="s" x="20" y="458">Accept it, argue about the setup</text><text class="t" x="20" y="472">% of all coded comments</text><rect x="20" y="480" width="80" height="16" fill="#2A2AD6" opacity="0.32"/><text class="n" x="110" y="492">23%</text><text class="t" x="156" y="492">before</text><rect x="20" y="502" width="19" height="16" fill="#2A2AD6"/><text class="n" x="49" y="514">6%</text><text class="t" x="89" y="514">after</text><text class="t" x="20" y="544">Different threads, same subreddit</text><text class="t" x="20" y="558">ecosystem and the same incident. The only</text><text class="t" x="20" y="572">thing that changed between them was an</text><text class="t" x="20" y="586">independent report.</text></svg>
