<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 662" width="360" height="662" role="img" aria-label="Before and after independent verification: rejecting it as fabricated fell from 22% to 14%, accepting it as real rose from 51% to 69%, calling it a marketing stunt fell from 12% to 9%, and accepting it while arguing about the setup fell from 23% to 6%"><desc id="chart-data">{"type": "paired", "title": "What changed when someone else checked the work", "subs": ["r/artificial reacting to OpenAI's own account, 31 July (n=52 coded), against eight subreddits reacting to METR and Redwood's independent report, after 26 August (n=464 coded)."], "series": ["Before", "After"], "rows": [{"label": "Reject it as fabricated or hyped", "note": "% of comments taking a position", "a": ["22%", 22], "b": ["14%", 14]}, {"label": "Accept it as real and consequential", "note": "% of comments taking a position", "a": ["51%", 51], "b": ["69%", 69]}, {"label": "Call it a marketing stunt", "note": "% of all coded comments", "a": ["12%", 12], "b": ["9%", 9]}, {"label": "Accept it, argue about the setup", "note": "% of all coded comments", "a": ["23%", 23], "b": ["6%", 6]}], "feet": ["Different threads, same subreddit ecosystem and the same incident. The only thing that changed between them was an independent report."], "aria": "Before and after independent verification: rejecting it as fabricated fell from 22% to 14%, accepting it as real rose from 51% to 69%, calling it a marketing stunt fell from 12% to 9%, and accepting it while arguing about the setup fell from 23% to 6%"}</desc><rect width="360" height="662" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">What changed when someone</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">else checked the work</text><text x="20.0" y="88.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"S