<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 542" width="360" height="542" role="img" aria-label="A vicious cycle: weak social mandate leads to weak governance, companies not incentivised, and passive public behaviour, which loops back to a weak mandate"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635f54"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635f54"/></marker></defs><rect width="360" height="542" fill="#f5f4ef"/><text x="20.0" y="39.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">We are in a vicious cycle</text><rect x="20" y="58" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="162.0" y="90.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Weak social mandate</text><text x="162.0" y="115.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">A minority see AI as a priority</text><text x="162.0" y="134.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">issue</text><path d="M162.0 150 L162.0 170" fill="none" stroke="#635f54" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="174" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="162.0" y="206.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Weak governance</text><text x="162.0" y="231.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">No mandate to hold the line on</text><text x="162.0" y="250.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">rules</text><path d="M162.0 266 L162.0 286" fill="none" stroke="#635f54" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="290" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="162.0" y="322.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Companies not incentivised</text><text x="162.0" y="347.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">No pressure to trade capability</text><text x="162.0" y="366.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">for safety</text><path d="M162.0 382 L162.0 402" fill="none" stroke="#635f54" stroke-width="1.7" marker-end="url(#a)"/><rect x="20" y="406" width="284" height="90" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="162.0" y="438.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Passive public behaviour</text><text x="162.0" y="463.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">People adopt tools without</text><text x="162.0" y="482.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">questioning</text><path d="M306 466 L322 466 Q332 466 332 456 L332 98 Q332 88 322 88 L308 88" fill="none" stroke="#635f54" stroke-width="1.5" marker-end="url(#b)"/><text x="180.0" y="518.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Each stage feeds the next</text></svg>
