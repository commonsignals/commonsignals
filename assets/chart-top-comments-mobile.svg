<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1118" width="360" height="1118" role="img" aria-label="The most-liked comments, ranked by likes, from 17,953 down to 167"><desc id="chart-data">{"title": "Likes concentrate in a handful of comments", "subs": ["Most-liked comments in the thread. Bar length is likes; 17,953 = full width."], "aria": "The most-liked comments, ranked by likes, from 17,953 down to 167", "type": "top", "rows": [{"quote": "\"Why isn't this common sense, we have movies about this since forever\"", "value": "17,953", "frac": 1.0, "key": "agree"}, {"quote": "\"Why do I feel like it's too late?\"", "value": "8,080", "frac": 0.45, "key": "agree"}, {"quote": "\"That's what the AI companies want you to think\" (reply)", "value": "7,639", "frac": 0.4266666666666667, "key": "agree"}, {"quote": "\"The fact that it needs to be explained in this way is both hilarious and incredibly scary.\"", "value": "5,058", "frac": 0.2833333333333333, "key": "agree"}, {"quote": "\"Friends don’t care. Friends say “too late, friend like dumb AI pictures and convenience”. Leaders don’t care. Leaders love money too much. We’re toast.\"", "value": "2,008", "frac": 0.11333333333333333, "key": "agree"}, {"quote": "\"soon we’ll have no mouths but must scream 😔😔😔😔\"", "value": "921", "frac": 0.05, "key": "agree"}, {"quote": "Soares's own reply, giving his credentials", "value": "512", "frac": 0.03, "key": "agree"}, {"quote": "\"Why did a handful of billionaires open Pandora's box and we just all went with it\"", "value": "487", "frac": 0.02666666666666667, "key": "agree"}, {"quote": "\"just fucking explain it normally\"", "value": "279", "frac": 0.016666666666666666, "key": "disagree"}, {"quote": "\"It's not!! These companies are relying on data centres getting built but they're getting blocked and campaigned against everywhere!!\"", "value": "167", "frac": 0.01, "key": "action"}, {"quote": "\"So Ai can commit serious worldwide crimes and create an Ai world but it cannot change the sky of your picture without changing your whole face? Mhmmm\"", "value": "120", "frac": 0.006666666666666667, "key": "disagree"}], "legend": {"agree": "Accepts the danger", "disagree": "Rejects or objects", "action": "Names an action"}, "feet": []}</desc><rect width="360" height="1118" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Likes concentrate in a</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">handful of comments</text><text x="20.0" y="88.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Most-liked comments in the thread. Bar</text><text x="20.0" y="106.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">length is likes; 17,953 = full width.</text><text x="20.0" y="137.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Why isn't this common sense, we have</text><text x="20.0" y="156.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">movies about this since forever"</text><rect x="20.0" y="163.9" width="250.0" height="14" fill="#0f8a78" rx="2"/><text x="278.0" y="175.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">17,953</text><text x="20.0" y="208.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Why do I feel like it's too late?"</text><rect x="20.0" y="215.9" width="112.5" height="14" fill="#0f8a78" rx="2"/><text x="140.5" y="227.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">8,080</text><text x="2