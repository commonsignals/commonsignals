<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 438" width="360" height="438" role="img" aria-label="Stance of the 1,224 comments with a readable position: 53 percent accept, 24 percent reject, 6 percent accept in part, 17 percent other"><rect width="360" height="438" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Did commenters accept that</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">AI is a serious danger?</text><text x="20.0" y="89.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Of the 1,224 comments that take a readable</text><text x="20.0" y="107.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">position</text><text x="20.0" y="140.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">Accept</text><rect x="20.0" y="147.9" width="256.0" height="22" fill="#7a1e49" rx="2"/><text x="284.0" y="164.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">53%</text><text x="20.0" y="198.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">Reject</text><rect x="20.0" y="205.9" width="115.9" height="22" fill="#7a1e49" opacity="0.70" rx="2"/><text x="143.9" y="222.2" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">24%</text><text x="20.0" y="256.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">Accept in part</text><rect x="20.0" y="263.9" width="29.0" height="22" fill="#7a1e49" opacity="0.50" rx="2"/><text x="57.0" y="280.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">6%</text><text x="20.0" y="314.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">Other</text><rect x="20.0" y="321.9" width="82.1" height="22" fill="#7a1e49" opacity="0.25" rx="2"/><text x="110.1" y="338.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">17%</text><text x="20.0" y="377.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Weighted by likes, agreement is close to</text><text x="20.0" y="396.1" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">universal: the four most-liked comments</text><text x="20.0" y="414.3" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">all accept.</text></svg>
