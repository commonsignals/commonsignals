<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Stance of the 1,224 comments with a readable position: 53 percent accept, 24 percent reject, 6 percent accept in part, 17 percent other" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 12px; fill: #635f54; }
    .n { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #232019; }
    .lbl { font-family: "IBM Plex Sans", -apple-system, sans-serif; font-size: 14px; fill: #232019; }
    .h { font-family: "Lora", Georgia, serif; font-size: 17px; font-weight: 600; fill: #232019; }
    .axis { stroke: #d8d6d1; stroke-width: 1; }
  </style>
  <rect width="720" height="280" fill="#f5f4ef"/>
  <text class="h" x="32" y="40">Did commenters accept that AI is a serious danger?</text>
  <text class="t" x="32" y="60">Of the 1,224 comments that take a readable position</text>

  <!-- scale: 100% = 460px, origin x=200 -->
  <g transform="translate(200,86)">
    <line class="axis" x1="0" y1="-6" x2="0" y2="164"/>

    <text class="lbl" x="-12" y="20" text-anchor="end">Accept</text>
    <rect x="0" y="4" width="244" height="24" fill="#7a1e49"/>
    <text class="n" x="252" y="21">53%</text>

    <text class="lbl" x="-12" y="60" text-anchor="end">Reject</text>
    <rect x="0" y="44" width="110" height="24" fill="#7a1e49" opacity="0.7"/>
    <text class="n" x="118" y="61">24%</text>

    <text class="lbl" x="-12" y="100" text-anchor="end">Accept in part</text>
    <rect x="0" y="84" width="28" height="24" fill="#7a1e49" opacity="0.5"/>
    <text class="n" x="36" y="101">6%</text>

    <text class="lbl" x="-12" y="140" text-anchor="end">Other</text>
    <rect x="0" y="124" width="78" height="24" fill="#7a1e49" opacity="0.25"/>
    <text class="n" x="86" y="141">17%</text>
  </g>

  <text class="t" x="32" y="262">Weighted by likes, agreement is close to universal: the four most-liked comments all accept.</text>
</svg>
