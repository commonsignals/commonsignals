</style><rect width="720" height="254" fill="#f5f4ef"/><text class="h" x="32" y="40">Did commenters accept the central claim?</text><text class="t" x="32" y="60">Of the 618 comments that take a readable position</text><line class="ax" x1="200" y1="80" x2="200" y2="210"/><text class="l" x="188" y="106" text-anchor="end">Agree</text><rect x="200" y="90" width="269" height="24" fill="#7a1e49" opacity="1.0"/><text class="n" x="477" y="107">58.6%</text><text class="l" x="188" y="146" text-anchor="end">Disagree</text><rect x="200" y="130" width="80" height="24" fill="#7a1e49" opacity="0.7"/><text class="n" x="288" y="147">17.5%</text><text class="l" x="188" y="186" text-anchor="end">Mixed</text><rect x="200" y="170" width="109" height="24" fill="#7a1e49" opacity="0.5"/><text class="n" x="317" y="187">23.9%</text><text class="t" x="32" y="234">Weighted by engagement, 86.5% of engagement sits with comments that agree.</text></svg>