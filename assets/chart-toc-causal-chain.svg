<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 831" width="600" height="831" role="img" aria-label="The causal chain from activities to impact: activities lead to outputs, which lead to communicator outcomes, which lead to public outcomes, which lead to a durable social mandate for AI governance, each step carrying an assumption"><style>
.title{font-family:"Lora",Georgia,serif;font-size:17px;font-weight:600;fill:#232019}
.head{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:14px;font-weight:600;fill:#232019}
.body,.sub,.pilltext{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:13px;fill:#5a564c}
.sub{fill:#006375}
.pilltext{fill:#232019}
.as{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:12.5px;font-style:italic;fill:#5a564c}
.ask{font-style:normal;font-weight:600;fill:#006375}
.grp{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:12.5px;font-weight:600;fill:#006375}
.box-control{fill:#dde9e7;stroke:#006375;stroke-width:1.4}
.box-contrib{fill:#f5f4ef;stroke:#008ba3;stroke-width:1.4;stroke-dasharray:5 4}
.pill{fill:#e8efec;stroke:#008ba3;stroke-width:1;stroke-opacity:.45}
.arrow{stroke:#006375;stroke-width:1.8;fill:none;marker-end:url(#tcc-arrow)}
.bracket{stroke:#006375;stroke-width:1.4;fill:none}
.bracket-dash{stroke:#008ba3;stroke-dasharray:4 3}
</style>
<defs>
<marker id="tcc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006375"/></marker>
</defs>
<rect width="600" height="831" fill="#f5f4ef"/>
<text class="title" x="100" y="32">The causal chain</text>
<rect class="box-control" x="100" y="52.0" width="480" height="99.6" rx="8"/>
<text class="head" x="340.0" y="85.9" text-anchor="middle">1. Activities: generate the evidence</text>
<text class="body" x="340.0" y="106.8" text-anchor="middle">Segmentation, message testing, comment analysis, messenger map,</text>
<text class="body" x="340.0" y="125.7" text-anchor="middle">training</text>
<path class="arrow" d="M124 155.55 L124 197.55"/>
<text class="as" x="140" y="179.7"><tspan class="ask">Assumption:</tspan> measured effects predict real-campaign effects</text>
<rect class="box-control" x="100" y="203.6" width="480" height="99.6" rx="8"/>
<text class="head" x="340.0" y="237.5" text-anchor="middle">2. Outputs: publish as open data</text>
<text class="body" x="340.0" y="258.4" text-anchor="middle">Published segments, tested frames, guides, trained messengers,</text>
<text class="body" x="340.0" y="277.2" text-anchor="middle">impact report</text>
<path class="arrow" d="M124 307.1 L124 349.1"/>
<text class="as" x="140" y="331.3"><tspan class="ask">Assumption:</tspan> evidence is seen as credible by both sides</text>
<rect class="box-control" x="100" y="355.1" width="480" height="99.5" rx="8"/>
<text class="head" x="340.0" y="389.0" text-anchor="middle">3. Communicator outcomes</text>
<text class="sub" x="340.0" y="409.9" text-anchor="middle">Our proximate outcome</text>
<text class="body" x="340.0" y="428.8" text-anchor="middle">Communicators change what they say and who says it</text>
<path class="arrow" d="M124 458.65 L124 512.9"/>
<text class="as" x="140" y="479.9"><tspan class="ask">Assumption:</tspan> communicators act on evidence, not instinct</text>
<text class="as" x="140" y="498.0">The assumption the whole model rests on</text>
<rect class="box-contrib" x="100" y="518.9" width="480" height="157.6" rx="8"/>
<text class="head" x="340.0" y="552.8" text-anchor="middle">4. Public outcomes</text>
<text class="body" x="340.0" y="573.7" text-anchor="middle">Concern becomes commitment</text>
<rect class="pill" x="122.0" y="598.5" width="137.3" height="58" rx="6"/>
<text class="pilltext" x="190.7" y="622.7" text-anchor="middle">Cross-societal</text>
<text class="pilltext" x="190.7" y="641.5" text-anchor="middle">concern</text>
<rect class="pill" x="271.3" y="598.5" width="137.3" height="58" rx="6"/>
<text class="pilltext" x="340.0" y="622.7" text-anchor="middle">Polarisation</text>
<text class="pilltext" x="340.0" y="641.5" text-anchor="middle">avoided</text>
<rect class="pill" x="420.7" y="598.5" width="137.3" height="58" rx="6"/>
<text class="pilltext" x="489.3" y="622.7" text-anchor="middle">Concern turned</text>
<text class="pilltext" x="489.3" y="641.5" text-anchor="middle">into action</text>
<path class="arrow" d="M124 680.55 L124 722.55"/>
<text class="as" x="140" y="704.7"><tspan class="ask">Assumption:</tspan> better communication moves attitudes at scale</text>
<rect class="box-contrib" x="100" y="728.5" width="480" height="80.7" rx="8"/>
<text class="head" x="340.0" y="762.4" text-anchor="middle">5. Impact: a durable social mandate for AI governance</text>
<text class="body" x="340.0" y="783.3" text-anchor="middle">Hard-to-reverse rules, and a social licence conditional on safety</text>
<path class="bracket" d="M65 52.0 L55 52.0 L55 454.6 L65 454.6"/>
<text class="grp" x="38" y="253.3" text-anchor="middle" transform="rotate(-90 38 253.3)">What we control and influence</text>
<path class="bracket bracket-dash" d="M65 518.9 L55 518.9 L55 809.2 L65 809.2"/>
<text class="grp" x="38" y="664.1" text-anchor="middle" transform="rotate(-90 38 664.1)">What we contribute to</text>
</svg>
