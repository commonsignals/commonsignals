<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1356" width="360" height="1356" role="img" aria-label="Most-engaged comments ranked"><desc id="chart-data">{"title": "Engagement concentrates in a handful of comments", "subs": ["Most-engaged comments. Bar length is engagement; 134 = full width."], "aria": "Most-engaged comments ranked", "type": "top", "rows": [{"quote": "\"“Trying to sell us a solution to a problem they created”— I don’t think I’ve ever said this before, but I wish I could give this multiple 👍\"", "value": "134", "frac": 1.0, "key": "agree"}, {"quote": "\"Behind every 'rogue' AI, is a wizard of Oz type rogue human.\"", "value": "77", "frac": 0.5733333333333334, "key": "agree"}, {"quote": "\"I think we're in big trouble as long as these tech companies are allowed to continue with no regulations or laws.\"", "value": "65", "frac": 0.48333333333333334, "key": "agree"}, {"quote": "\"I love that she mentions that the perpetuating of saying AI itself is evil absolves openAI from their responsibility THIS is the key message.\"", "value": "54", "frac": 0.4, "key": "agree"}, {"quote": "\"A new \"Watchdog\" agency is needed for all of this.\"", "value": "47", "frac": 0.35, "key": "agree"}, {"quote": "\"Been saying for awhile the danger isn't AI it's who's developing &amp; controlling it.\"", "value": "44", "frac": 0.32666666666666666, "key": "agree"}, {"quote": "\"Wow! Phenomenal guest very informational. Thank you\"", "value": "41", "frac": 0.30333333333333334, "key": "agree"}, {"quote": "\"This is the most intelligent, cogent, clearly stated and non-sensationalistic commentary on the issue that I've seen. She should be on every talk show!\"", "value": "38", "frac": 0.2833333333333333, "key": "agree"}, {"quote": "\"Never trust Sam Altman\"", "value": "35", "frac": 0.26, "key": "agree"}, {"quote": "\"One would think that after an incident like this Congress would have been busy drawing up regulations to govern the companies and what they are allowed to do with this technology.\"", "value": "34", "frac": 0.25333333333333335, "key": "agree"}, {"quote": "\"Thanks PBS for not falling for the 'agents went rogue' explanation and seeing this for what it is - carelessness on the part of AI companies.\"", "value": "25", "frac": 0.18333333333333332, "key": "agree"}, {"quote": "\"I'm glad I watched this commentary. Heidi Khlaaf is brilliant and was really good at explaining what happened in a manner that actually made sense to a computer language illiterate such as myself.\"", "value": "21", "frac": 0.15666666666666668, "key": "agree"}], "legend": {"agree": "Agrees"}, "feet": []}</desc><rect width="360" height="1356" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Engagement concentrates in a</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">handful of comments</text><text x="20.0" y="88.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Most-engaged comments. Bar length is</text><text x="20.0" y="106.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">engagement; 134 = full width.</text><text x="20.0" y="137.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"“Trying to sell us a solution to a</text><text x="20.0" y="156.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">problem they created”— I don’t think</text><text x="20.0" y="175.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">I’ve ever said this before, but I wish</text><text x="20.0" y="194.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">I could give this multiple 👍"</text><rect x="20.0" y="201.9" width="250.0" height="14" fill="#0f8a78" rx="2"/><text x="278.0" y="213.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">134</text><text x="20.0" y="246.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Behind every 'rogue' AI, is a wizard</text><text x="20.0" y="265.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">of Oz type rogue human."</text><rect x="20.0" y="272.9" width="143.3" height="14" fill="#0f8a78" rx="2"/><text x="171.3" y="284.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">77</text><text x="20.0" y="317.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"I think we're in big trouble as long</text><text x="20.0" y="336.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">as these tech companies are allowed to</text><text x="20.0" y="355.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">continue with no regulations or laws."</text><rect x="20.0" y="362.9" width="120.8" height="14" fill="#0f8a78" rx="2"/><text x="148.8" y="374.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">65</text><text x="20.0" y="407.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"I love that she mentions that the</text><text x="20.0" y="426.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">perpetuating of saying AI itself is</text><text x="20.0" y="445.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">evil absolves openAI from their</text><text x="20.0" y="464.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">responsibility THIS is the key</text><text x="20.0" y="483.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">message."</text><rect x="20.0" y="490.9" width="100.0" height="14" fill="#0f8a78" rx="2"/><text x="128.0" y="502.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">54</text><text x="20.0" y="535.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"A new "Watchdog" agency is needed for</text><text x="20.0" y="554.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">all of this."</text><rect x="20.0" y="561.9" width="87.5" height="14" fill="#0f8a78" rx="2"/><text x="115.5" y="573.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">47</text><text x="20.0" y="606.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Been saying for awhile the danger</text><text x="20.0" y="625.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">isn't AI it's who's developing &amp;</text><text x="20.0" y="644.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">controlling it."</text><rect x="20.0" y="651.9" width="81.7" height="14" fill="#0f8a78" rx="2"/><text x="109.7" y="663.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">44</text><text x="20.0" y="696.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Wow! Phenomenal guest very</text><text x="20.0" y="715.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">informational. Thank you"</text><rect x="20.0" y="722.9" width="75.8" height="14" fill="#0f8a78" rx="2"/><text x="103.8" y="734.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">41</text><text x="20.0" y="767.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"This is the most intelligent, cogent,</text><text x="20.0" y="786.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">clearly stated and non-sensationalistic</text><text x="20.0" y="805.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">commentary on the issue that I've seen.</text><text x="20.0" y="824.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">She should be on every talk show!"</text><rect x="20.0" y="831.9" width="70.8" height="14" fill="#0f8a78" rx="2"/><text x="98.8" y="843.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">38</text><text x="20.0" y="876.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Never trust Sam Altman"</text><rect x="20.0" y="883.9" width="65.0" height="14" fill="#0f8a78" rx="2"/><text x="93.0" y="895.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">35</text><text x="20.0" y="928.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"One would think that after an incident</text><text x="20.0" y="947.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">like this Congress would have been busy</text><text x="20.0" y="966.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">drawing up regulations to govern the</text><text x="20.0" y="985.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">companies and what they are allowed to</text><text x="20.0" y="1004.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">do with this technology."</text><rect x="20.0" y="1011.9" width="63.3" height="14" fill="#0f8a78" rx="2"/><text x="91.3" y="1023.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">34</text><text x="20.0" y="1056.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Thanks PBS for not falling for the</text><text x="20.0" y="1075.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">'agents went rogue' explanation and</text><text x="20.0" y="1094.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">seeing this for what it is -</text><text x="20.0" y="1113.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">carelessness on the part of AI</text><text x="20.0" y="1132.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">companies."</text><rect x="20.0" y="1139.9" width="45.8" height="14" fill="#0f8a78" rx="2"/><text x="73.8" y="1151.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">25</text><text x="20.0" y="1184.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"I'm glad I watched this commentary.</text><text x="20.0" y="1203.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">Heidi Khlaaf is brilliant and was</text><text x="20.0" y="1222.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">really good at explaining what happened</text><text x="20.0" y="1241.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">in a manner that actually made sense to</text><text x="20.0" y="1260.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">a computer language illiterate such as</text><text x="20.0" y="1279.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">myself."</text><rect x="20.0" y="1286.9" width="39.2" height="14" fill="#0f8a78" rx="2"/><text x="67.2" y="1298.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">21</text><rect x="20.0" y="1318.9" width="11.0" height="11" fill="#0f8a78" rx="2"/><text x="36.0" y="1328.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Agrees</text></svg>
