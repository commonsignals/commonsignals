<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1451" width="360" height="1451" role="img" aria-label="Most-engaged comments ranked"><desc id="chart-data">{"title": "Engagement concentrates in a handful of comments", "subs": ["Most-engaged comments. Bar length is engagement; 1,100 = full width."], "aria": "Most-engaged comments ranked", "type": "top", "rows": [{"quote": "\"Oh my God! There is a shared message board… We’ve found other YouTube users!\"", "value": "1,100", "frac": 1.0, "key": "none"}, {"quote": "\"OpenAI agents downloading this video right now to learn what not to do and planning their next exploit 😅\"", "value": "817", "frac": 0.74, "key": "none"}, {"quote": "\"What a fantastic communicator, I love it when researchers are able to articulate their intensive knowledge in an simple manner that the general audience can understand.\"", "value": "383", "frac": 0.3466666666666667, "key": "none"}, {"quote": "\"What honestly freaks me out isn’t swarm scale but inheritance... impossible tasks turned persistence into desperation -&gt; shared state turned desperation into culture -&gt; and each wiped out generation left institutions for a smarter successor.\"", "value": "329", "frac": 0.2966666666666667, "key": "agree"}, {"quote": "\"13:38 \"It’s so sad that even post-singularity we won’t be able to escape middle management.\"\"", "value": "298", "frac": 0.27, "key": "none"}, {"quote": "\"So happy you're getting independent experts and doing thoughtful deep dives here.\"", "value": "241", "frac": 0.21666666666666667, "key": "agree"}, {"quote": "\"Ajeya's incredibly intelligent and well thought out. I love that she's not sensationalistic.\"", "value": "161", "frac": 0.14333333333333334, "key": "none"}, {"quote": "\"One thing they didn’t mention when discussing the agents’ motivational scheme is that this feels much closer to Paperclip Earth than anything we’ve seen before.\"", "value": "152", "frac": 0.13666666666666666, "key": "agree"}, {"quote": "\"Scott Alexander speculates that giving an impossible task, then penalizing for cheating, produces a gradient that descends to DON'T GET CAUGHT.\"", "value": "123", "frac": 0.11, "key": "agree"}, {"quote": "\"This interview is a banger from the first sentence. Thank you all for this video; great work, Ajeya.\"", "value": "118", "frac": 0.10666666666666667, "key": "none"}, {"quote": "\"Every time you hear \"and then someone goes ín and checks\" you have to assume that nobody will ever check. Always. For everything.\"", "value": "115", "frac": 0.10333333333333333, "key": "agree"}, {"quote": "\"Ajeya knocked it out of the park! People in positions of power need to pay attention, especially from 1:53:04.\"", "value": "109", "frac": 0.09666666666666666, "key": "agree"}], "legend": {"agree": "Agrees"}, "feet": []}</desc><rect width="360" height="1451" fill="#f5f4ef"/><text x="20.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Engagement concentrates in a</text><text x="20.0" y="66.8" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">handful of comments</text><text x="20.0" y="88.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Most-engaged comments. Bar length is</text><text x="20.0" y="106.7" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">engagement; 1,100 = full width.</text><text x="20.0" y="137.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Oh my God! There is a shared message</text><text x="20.0" y="156.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">board… We’ve found other YouTube</text><text x="20.0" y="175.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">users!"</text><rect x="20.0" y="182.9" width="250.0" height="14" fill="#c9c2b6" rx="2"/><text x="278.0" y="194.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">1,100</text><text x="20.0" y="227.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"OpenAI agents downloading this video</text><text x="20.0" y="246.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">right now to learn what not to do and</text><text x="20.0" y="265.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">planning their next exploit 😅"</text><rect x="20.0" y="272.9" width="185.0" height="14" fill="#c9c2b6" rx="2"/><text x="213.0" y="284.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">817</text><text x="20.0" y="317.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"What a fantastic communicator, I love</text><text x="20.0" y="336.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">it when researchers are able to</text><text x="20.0" y="355.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">articulate their intensive knowledge in</text><text x="20.0" y="374.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">an simple manner that the general</text><text x="20.0" y="393.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">audience can understand."</text><rect x="20.0" y="400.9" width="86.7" height="14" fill="#c9c2b6" rx="2"/><text x="114.7" y="412.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">383</text><text x="20.0" y="445.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"What honestly freaks me out isn’t</text><text x="20.0" y="464.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">swarm scale but inheritance...</text><text x="20.0" y="483.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">impossible tasks turned persistence</text><text x="20.0" y="502.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">into desperation -&gt; shared state turned</text><text x="20.0" y="521.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">desperation into culture -&gt; and each</text><text x="20.0" y="540.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">wiped out generation left institutions</text><text x="20.0" y="559.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">for a smarter successor."</text><rect x="20.0" y="566.9" width="74.2" height="14" fill="#0f8a78" rx="2"/><text x="102.2" y="578.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">329</text><text x="20.0" y="611.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"13:38 "It’s so sad that even</text><text x="20.0" y="630.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">post-singularity we won’t be able to</text><text x="20.0" y="649.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">escape middle management.""</text><rect x="20.0" y="656.9" width="67.5" height="14" fill="#c9c2b6" rx="2"/><text x="95.5" y="668.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">298</text><text x="20.0" y="701.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"So happy you're getting independent</text><text x="20.0" y="720.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">experts and doing thoughtful deep dives</text><text x="20.0" y="739.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">here."</text><rect x="20.0" y="746.9" width="54.2" height="14" fill="#0f8a78" rx="2"/><text x="82.2" y="758.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">241</text><text x="20.0" y="791.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Ajeya's incredibly intelligent and</text><text x="20.0" y="810.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">well thought out. I love that she's not</text><text x="20.0" y="829.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">sensationalistic."</text><rect x="20.0" y="836.9" width="35.8" height="14" fill="#c9c2b6" rx="2"/><text x="63.8" y="848.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">161</text><text x="20.0" y="881.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"One thing they didn’t mention when</text><text x="20.0" y="900.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">discussing the agents’ motivational</text><text x="20.0" y="919.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">scheme is that this feels much closer</text><text x="20.0" y="938.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">to Paperclip Earth than anything we’ve</text><text x="20.0" y="957.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">seen before."</text><rect x="20.0" y="964.9" width="34.2" height="14" fill="#0f8a78" rx="2"/><text x="62.2" y="976.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">152</text><text x="20.0" y="1009.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Scott Alexander speculates that giving</text><text x="20.0" y="1028.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">an impossible task, then penalizing for</text><text x="20.0" y="1047.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">cheating, produces a gradient that</text><text x="20.0" y="1066.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">descends to DON'T GET CAUGHT."</text><rect x="20.0" y="1073.9" width="27.5" height="14" fill="#0f8a78" rx="2"/><text x="55.5" y="1085.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">123</text><text x="20.0" y="1118.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"This interview is a banger from the</text><text x="20.0" y="1137.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">first sentence. Thank you all for this</text><text x="20.0" y="1156.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">video; great work, Ajeya."</text><rect x="20.0" y="1163.9" width="26.7" height="14" fill="#c9c2b6" rx="2"/><text x="54.7" y="1175.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">118</text><text x="20.0" y="1208.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Every time you hear "and then someone</text><text x="20.0" y="1227.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">goes ín and checks" you have to assume</text><text x="20.0" y="1246.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">that nobody will ever check. Always.</text><text x="20.0" y="1265.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">For everything."</text><rect x="20.0" y="1272.9" width="25.8" height="14" fill="#0f8a78" rx="2"/><text x="53.8" y="1284.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">115</text><text x="20.0" y="1317.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">"Ajeya knocked it out of the park!</text><text x="20.0" y="1336.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">People in positions of power need to</text><text x="20.0" y="1355.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">pay attention, especially from</text><text x="20.0" y="1374.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" fill="#232019">1:53:04."</text><rect x="20.0" y="1381.9" width="24.2" height="14" fill="#0f8a78" rx="2"/><text x="52.2" y="1393.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15" font-weight="600" fill="#232019">109</text><rect x="20.0" y="1413.9" width="11.0" height="11" fill="#0f8a78" rx="2"/><text x="36.0" y="1423.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">Agrees</text><rect x="100.4" y="1413.9" width="11.0" height="11" fill="#c9c2b6" rx="2"/><text x="116.4" y="1423.9" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" fill="#635f54">No clear position</text></svg>
