<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 268" width="820" height="268" role="img" aria-label="Composition of the mixed bloc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.t{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:12px;fill:#5C5E64}.n{font-family:"Space Mono",ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;fill:#17181C}.l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14px;fill:#17181C}.s{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:13px;font-weight:600;fill:#17181C}.h{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;font-weight:600;fill:#17181C}.ax{stroke:#DBDBD3;stroke-width:1}</style><rect width="820" height="268" fill="#F4F4EF"/><text class="h" x="32" y="36">What the mixed majority actually believes</text><text class="t" x="32" y="56">The 186 comments coded mixed after the report, by the frame they lead with. None of them dispute that the incident happened.</text><text class="l" x="366" y="101" text-anchor="end">They blame the humans, not the agents</text><rect x="380" y="84" width="360" height="22" fill="#2A2AD6" opacity="0.75"/><text class="n" x="750" y="101">42</text><text class="l" x="366" y="133" text-anchor="end">They argue the eval was badly designed</text><rect x="380" y="116" width="240" height="22" fill="#2A2AD6" opacity="0.75"/><text class="n" x="630" y="133">28</text><text class="l" x="366" y="165" text-anchor="end">They sympathise with the agents</text><rect x="380" y="148" width="145" height="22" fill="#2A2AD6" opacity="0.75"/><text class="n" x="535" y="165">17</text><text class="l" x="366" y="197" text-anchor="end">They find the coordination impressive</text><rect x="380" y="180" width="128" height="22" fill="#2A2AD6" opacity="0.75"/><text class="n" x="518" y="197">15</text><text class="l" x="366" y="229" text-anchor="end">They object to the agent framing</text><rect x="380" y="212" width="85" height="22" fill="#2A2AD6" opacity="0.75"/><text class="n" x="475" y="229">10</text></svg>