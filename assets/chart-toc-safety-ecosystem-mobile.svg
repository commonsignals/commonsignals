<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 672" width="360" height="672" role="img" aria-label="Two models compared: a prescriptive model where experts dictate rules to passive users, versus a collaborative ecosystem where researchers, regulators, industry and the public actively co-create safety measures through networked feedback"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635f54"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a1e49"/></marker></defs><rect width="360" height="672" fill="#f5f4ef"/><text x="20.0" y="39.0" font-family='"Lora",Georgia,serif' font-size="19" font-weight="600" fill="#232019">Two models of AI safety</text><text x="20.0" y="73.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-weight="600" letter-spacing="0.5" fill="#7a1e49">PRESCRIPTIVE MODEL</text><rect x="70.0" y="86" width="220" height="46" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="180.0" y="118.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">AI safety experts</text><path d="M180.0 134 L180.0 162" fill="none" stroke="#635f54" stroke-width="1.7" marker-end="url(#a)"/><rect x="70.0" y="166" width="220" height="90" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="180.0" y="198.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Society &amp; AI users</text><text x="180.0" y="223.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Passive recipients of</text><text x="180.0" y="242.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">rules handed down</text><line x1="20" y1="280" x2="340" y2="280" stroke="#d8d6d1" stroke-width="1"/><text x="20.0" y="317.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13.5" font-weight="600" letter-spacing="0.5" fill="#7a1e49">COLLABORATIVE ECOSYSTEM</text><rect x="70.0" y="330" width="220" height="66" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="180.0" y="362.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Regulatory bodies &amp;</text><text x="180.0" y="382.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">safety institutes</text><rect x="20" y="436" width="152.0" height="86" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="96.0" y="468.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">AI safety</text><text x="96.0" y="488.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">researchers &amp;</text><text x="96.0" y="508.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">ethicists</text><rect x="188.0" y="436" width="152.0" height="86" rx="8" fill="#f5f4ef" stroke="#635f54" stroke-width="1.3"/><text x="264.0" y="468.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">AI industry &amp;</text><text x="264.0" y="488.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">tech</text><text x="264.0" y="508.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">developers</text><rect x="70.0" y="562" width="220" height="90" rx="8" fill="#f5f4ef" stroke="#7a1e49" stroke-width="1.8"/><text x="180.0" y="594.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="15.5" font-weight="600" text-anchor="middle" fill="#232019">Society &amp; AI users</text><text x="180.0" y="619.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">Active stakeholders in</text><text x="180.0" y="638.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" text-anchor="middle" fill="#635f54">value alignment</text><path d="M180.0 559 L180.0 399" fill="none" stroke="#7a1e49" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#b)" marker-end="url(#b)"/><path d="M100.0 559 L96.0 525" fill="none" stroke="#7a1e49" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#b)" marker-end="url(#b)"/><path d="M260.0 559 L264.0 525" fill="none" stroke="#7a1e49" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#b)" marker-end="url(#b)"/></svg>
