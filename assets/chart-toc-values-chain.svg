<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The systemic process of integrating AI safety: aligning foundational values, cultivating risk awareness, establishing technical norms, and implementing concrete actions, which reinforce the values in turn"><style>
.t{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:11.5px;fill:#635f54}
.n{font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:13px;font-weight:600;fill:#232019}
.h{font-family:"Lora",Georgia,serif;font-size:17px;font-weight:600;fill:#232019}
.bx{fill:#f5f4ef;stroke:#7a1e49;stroke-width:1.2}
.ar{stroke:#7a1e49;stroke-width:1.6;fill:none;marker-end:url(#tocvch-a)}
.rf{stroke:#635f54;stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#tocvch-b)}
</style>
<defs>
<marker id="tocvch-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a1e49"/></marker>
<marker id="tocvch-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#635f54"/></marker>
</defs>
<rect width="720" height="300" fill="#f5f4ef"/>
<text class="h" x="32" y="34">Values reinforce actions, and actions reinforce values</text>

<rect class="bx" x="30" y="68" width="155" height="130" rx="8"/>
<text class="n" x="107" y="92" text-anchor="middle">Foundational</text>
<text class="n" x="107" y="108" text-anchor="middle">values</text>
<text class="t" x="107" y="132" text-anchor="middle">Wellbeing</text>
<text class="t" x="107" y="150" text-anchor="middle">Fairness</text>
<text class="t" x="107" y="168" text-anchor="middle">Transparency</text>

<rect class="bx" x="200" y="68" width="155" height="130" rx="8"/>
<text class="n" x="277" y="92" text-anchor="middle">Systemic &amp;</text>
<text class="n" x="277" y="108" text-anchor="middle">risk beliefs</text>
<text class="t" x="277" y="132" text-anchor="middle">Capability awareness</text>
<text class="t" x="277" y="150" text-anchor="middle">Risk awareness</text>
<text class="t" x="277" y="168" text-anchor="middle">Developer responsibility</text>

<rect class="bx" x="370" y="68" width="155" height="130" rx="8"/>
<text class="n" x="447" y="92" text-anchor="middle">Technical &amp;</text>
<text class="n" x="447" y="108" text-anchor="middle">governance norms</text>
<text class="t" x="447" y="132" text-anchor="middle">Safety processes</text>
<text class="t" x="447" y="150" text-anchor="middle">Red-teaming</text>
<text class="t" x="447" y="168" text-anchor="middle">Transparency reports</text>

<rect class="bx" x="540" y="68" width="155" height="130" rx="8"/>
<text class="n" x="617" y="92" text-anchor="middle">Implemented</text>
<text class="n" x="617" y="108" text-anchor="middle">actions</text>
<text class="t" x="617" y="132" text-anchor="middle">Interpretability tools</text>
<text class="t" x="617" y="150" text-anchor="middle">Independent auditing</text>
<text class="t" x="617" y="168" text-anchor="middle">Regulatory compliance</text>

<path class="ar" d="M187 133 L198 133"/>
<path class="ar" d="M357 133 L368 133"/>
<path class="ar" d="M527 133 L538 133"/>
<path class="rf" d="M617 200 C 617 250, 107 250, 107 200" />
<text class="t" x="362" y="270" text-anchor="middle">Reinforcing</text>
</svg>
