<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survey admin: Common Signals</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --paper: #f5f4ef; --paper-2: #eae8e1; --ink: #232019; --ink-faint: #635f54;
    --line: rgba(35,32,25,0.14); --signal: #7a1e49; --signal-soft: #f0dde7;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  main { max-width: 48rem; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.4rem; }
  label { display: block; font-size: 0.85rem; color: var(--ink-faint); margin-bottom: 0.3rem; }
  input, select { font: inherit; padding: 0.6rem 0.8rem; border: 1px solid var(--line); border-radius: 0.4rem; width: 100%; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .row > div { flex: 1 1 12rem; }
  button { font: inherit; font-weight: 600; padding: 0.6rem 1.2rem; border-radius: 0.4rem; border: 1px solid var(--signal); background: var(--signal); color: #fff; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.8rem; margin: 1.5rem 0; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 0.5rem; padding: 1rem; }
  .stat .num { font-size: 1.6rem; font-weight: 700; }
  .stat .cap { font-size: 0.8rem; color: var(--ink-faint); }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
  .bar-track { flex: 1; background: var(--paper-2); border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--signal); height: 100%; }
  .error { color: var(--signal); }
  .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .actions a { text-decoration: none; }
  .actions button { background: transparent; color: var(--signal); }
</style>
</head>
<body>
<main>
  <h1>Survey admin dashboard</h1>
  <div class="row">
    <div>
      <label for="token">Admin token</label>
      <input type="password" id="token" placeholder="Bearer token" autocomplete="off" />
    </div>
    <div>
      <label for="study">Study</label>
      <input type="text" id="study" value="test" />
    </div>
    <div style="flex: 0 0 auto; align-self: flex-end;">
      <button id="loadBtn">Load</button>
    </div>
  </div>

  <div class="actions" id="exportActions" style="display:none;">
    <button id="exportCsv">Export CSV</button>
    <button id="exportJson">Export JSON</button>
    <button id="exportCodebook">Codebook</button>
  </div>

  <p id="error" class="error"></p>
  <div id="results"></div>
</main>
<script data-cfasync="false">
(function () {
  var tokenInput = document.getElementById('token');
  var studyInput = document.getElementById('study');
  var errorEl = document.getElementById('error');
  var resultsEl = document.getElementById('results');
  var exportActions = document.getElementById('exportActions');

  try {
    var savedToken = sessionStorage.getItem('surveyAdminToken');
    if (savedToken) tokenInput.value = savedToken;
  } catch (e) {}

  function authHeaders() {
    return { authorization: 'Bearer ' + tokenInput.value };
  }

  function bar(label, n, max) {
    var pct = max > 0 ? Math.round((n / max) * 100) : 0;
    return '<div class="bar-row"><span style="width:8rem;">' + label + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<span>' + n + '</span></div>';
  }

  function render(data) {
    var maxCond = Math.max(1, ...data.by_condition.map(function (c) { return c.n; }));
    var html = '<div class="stats">' +
      stat(data.started, 'Started') +
      stat(data.completed, 'Completed') +
      stat(data.screened_out, 'Screened out') +
      stat(data.comprehension_pass, 'Comprehension pass') +
      stat(data.comprehension_fail, 'Comprehension fail') +
      stat(data.avg_duration_s !== null ? data.avg_duration_s + 's' : '–', 'Avg. duration') +
      stat(data.target_n !== null ? data.target_n : '–', 'Target n') +
      stat(data.open ? 'Open' : 'Closed', 'Status') +
      '</div>';
    html += '<h2>By condition</h2>';
    data.by_condition.forEach(function (c) {
      html += bar('Condition ' + c.condition, c.n, maxCond);
    });
    html += '<h2>By day</h2><table><thead><tr><th>Day</th><th>Started</th></tr></thead><tbody>';
    data.by_day.forEach(function (d) {
      html += '<tr><td>' + d.day + '</td><td>' + d.n + '</td></tr>';
    });
    html += '</tbody></table>';
    resultsEl.innerHTML = html;
  }
  function stat(num, cap) {
    return '<div class="stat"><div class="num">' + num + '</div><div class="cap">' + cap + '</div></div>';
  }

  function load() {
    errorEl.textContent = '';
    exportActions.style.display = 'none';
    try { sessionStorage.setItem('surveyAdminToken', tokenInput.value); } catch (e) {}
    var study = encodeURIComponent(studyInput.value.trim());
    fetch('/api/survey/status?study=' + study, { headers: authHeaders() })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Request failed'); });
        return r.json();
      })
      .then(function (data) {
        render(data);
        exportActions.style.display = 'flex';
      })
      .catch(function (e) { errorEl.textContent = e.message; resultsEl.innerHTML = ''; });
  }

  function downloadExport(format) {
    var study = encodeURIComponent(studyInput.value.trim());
    fetch('/api/survey/export?study=' + study + '&format=' + format, { headers: authHeaders() })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Export failed'); });
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = studyInput.value.trim() + '-' + format + (format === 'json' ? '.json' : '.csv');
        a.click();
        URL.revokeObjectURL(url);
      })
      .catch(function (e) { errorEl.textContent = e.message; });
  }

  document.getElementById('loadBtn').addEventListener('click', load);
  document.getElementById('exportCsv').addEventListener('click', function () { downloadExport('csv'); });
  document.getElementById('exportJson').addEventListener('click', function () { downloadExport('json'); });
  document.getElementById('exportCodebook').addEventListener('click', function () { downloadExport('codebook'); });
})();
</script>
</body>
</html>
