name = "commonsignals"
pages_build_output_dir = "."
compatibility_date = "2026-09-24"

# Pages' wrangler.toml validator rejects [[send_email]] outright ("Configuration
# file for Pages projects does not support send_email"), even though `wrangler
# pages dev` accepts it locally. The SEND_EMAIL binding functions/api/contact.js
# needs must instead be added via the dashboard: Pages project > Settings >
# Functions > Email bindings > add binding "SEND_EMAIL", destination address
# hello@commonsignals.org, for both Production and Preview.

[[d1_databases]]
binding = "SURVEY_DB"
database_name = "commonsignals-survey"
database_id = "abbf1d32-76de-451c-93d1-80ce64a1fa73"

# Used only to rate-limit /api/survey/save.
[[kv_namespaces]]
binding = "SURVEY_RATE_LIMIT"
id = "2c8144a9a0d74ba1977569583a25fb74"
