<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="doac-c1-t doac-c1-d"><title id="doac-c1-t">Four versions of one debate: agreement from 49% to 88%</title><desc id="doac-c1-d">YouTube, full episode: 77% agree, 20% disagree, 3% mixed (n = 15,928); Full episode, debater verdicts removed: 66% agree, 29% disagree, 5% mixed (n = 9,670); Facebook, 21-minute cut: 88% agree, 11% disagree, 2% mixed (n = 1,366); YouTube Shorts, 104-second trailer: 49% agree, 40% disagree, 11% mixed (n = 171)</desc><rect width="720" height="480" fill="#f5f4ef"/><text x="32.0" y="43.0" font-family='"Lora",Georgia,serif' font-size="17" font-weight="600" fill="#232019">Four versions of one debate: agreement from 49% to 88%</text><text x="32.0" y="64.0" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="#635f54">Agree, disagree and mixed, as shares of comments taking a readable position</text><rect x="32.0" y="77.5" width="10" height="10" fill="#0f8a78" rx="2"/><text x="47.0" y="87.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="#635f54">Agree</text><rect x="96.6" y="77.5" width="10" height="10" fill="#8c8579" rx="2"/><text x="111.6" y="87.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="#635f54">Disagree</text><rect x="181.4" y="77.5" width="10" height="10" fill="#c9c2b6" rx="2"/><text x="196.4" y="87.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="#635f54">Mixed</text><text x="32.0" y="113.5" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="14" font-weight="600" fill="#232019">YouTube, full episode</text><text x="32.0" y="130.6" font-family='"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12.5" fill="#635f54">n = 15,92